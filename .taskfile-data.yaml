---
# .taskfile-data.yaml
# Optional configuration for dr task compose / `task:dev` (drdev)

# Development server ports — order matters (started top to bottom).
# Dashboard needs fastapi_server + frontend_web; agent/MCP are optional for chat.
ports:
  - name: fastapi_server
    port: 8080
    print_url: true
  - name: frontend_web
    port: 5173
    print_url: true
  - name: agent
    port: 8842
  - name: mcp_server
    port: 9000
